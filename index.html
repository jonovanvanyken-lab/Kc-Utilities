<div class="cl-splash" id="clSplash" role="img" aria-label="Kč Utilities by Circulyte Labs"><svg viewBox="0 0 210 210" aria-hidden="true"><use href="#clm-mark"/></svg><div class="cl-app">Kč Utilities</div><div class="cl-co">Circulyte Labs</div></div>
<script src="circulyte.js?v=1"></script>

<div id="lock" class="lock">
  <div class="lock-card">
    <div class="lock-brand"><img src="icons/icon-192.png" alt="" width="54" height="54"><h1>Kč Utilities</h1></div>
    <p class="lock-sub" id="lockSub">Checking this device…</p>

    <form id="unlockForm" hidden autocomplete="off">
      <label class="fld"><span>Passphrase</span><input class="in" id="unlockPass" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required></label>
      <label class="check"><input type="checkbox" id="unlockRemember" checked><span>Keep unlocked on this device</span></label>
      <button class="btn primary" type="submit">Unlock</button>
      <p class="hint" id="unlockHint"></p>
    </form>

    <div id="startChoice" class="lock-stack" hidden>
      <button class="btn primary" id="startNew" type="button">Start on this device</button>
      <button class="btn" id="startJoin" type="button">Join one that’s already synced</button>
      <button class="btn" id="startRestore" type="button">Restore a backup</button>
      <p class="fine">Readings, bills and meter photos are encrypted on this device with your passphrase before they’re saved or synced. There is no passphrase reset, so keep it in a password manager.</p>
    </div>

    <form id="newForm" hidden autocomplete="off">
      <label class="fld"><span>Choose a passphrase (10 characters or more)</span><input class="in" id="newPass" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" required></label>
      <label class="fld"><span>Type it again</span><input class="in" id="newPass2" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" required></label>
      <label class="check"><input type="checkbox" id="newRemember" checked><span>Keep unlocked on this device</span></label>
      <button class="btn primary" type="submit">Set up Kč Utilities</button>
      <button class="btn ghost" type="button" data-back="1">Back</button>
      <p class="hint" id="newHint"></p>
    </form>

    <form id="joinForm" hidden autocomplete="off">
      <label class="fld"><span>Private repository</span><input class="in" id="joinRepo" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="your-username/Kc-Utilities-Data" required></label>
      <label class="fld"><span>Access token (Contents: read and write, that repository only)</span><input class="in" id="joinToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" required></label>
      <label class="fld"><span>Passphrase</span><input class="in" id="joinPass" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required></label>
      <label class="check"><input type="checkbox" id="joinRemember" checked><span>Keep unlocked on this device</span></label>
      <button class="btn primary" type="submit">Join</button>
      <button class="btn ghost" type="button" data-back="1">Back</button>
      <p class="hint" id="joinHint"></p>
    </form>

    <form id="restoreForm" hidden autocomplete="off">
      <label class="fld"><span>Backup file</span><input class="in" id="restoreFile" type="file" accept="application/json,.json" required></label>
      <label class="fld"><span>The backup’s passphrase</span><input class="in" id="restorePass" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required></label>
      <label class="check"><input type="checkbox" id="restoreRemember" checked><span>Keep unlocked on this device</span></label>
      <button class="btn primary" type="submit">Restore</button>
      <button class="btn ghost" type="button" data-back="1">Back</button>
      <p class="hint" id="restoreHint"></p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="wrap top-row">
      <h1 class="brand"><span class="brand-mark" aria-hidden="true">Kč</span>Utilities</h1>
      <div class="top-actions">
        <span class="navbtns" id="navbtns"></span>
        <button class="sync" id="sync" type="button" data-s="local"><span class="sync-dot"></span><span id="sync-text">On this device</span></button>
        <button class="iconbtn" id="lockBtn" type="button" aria-label="Lock" title="Lock"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.2 10.5V8a3.8 3.8 0 0 1 7.6 0v2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      </div>
    </div>
    <nav class="wrap tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  </header>
  <main class="wrap" id="main" aria-live="polite"></main>
  <button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>Add reading</button>
</div>
<div class="sheet-wrap" id="sheet" hidden><div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-body"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="pickFile" hidden>

<script src="app.js?v=1.8"></script>
</body>
</html>
